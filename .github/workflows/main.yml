name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Fix Directory Structure
      run: |
        mkdir -p app/src/main/java/com/example/myapp
        mkdir -p app/src/main
        
        # Move files to expected Android folder structure
        if [ -f "AndroidManifest.xml" ]; then mv AndroidManifest.xml app/src/main/; fi
        if [ -f "MainActivity.kt" ]; then mv MainActivity.kt app/src/main/java/com/example/myapp/; fi
        if [ -f "MainActivity.java" ]; then mv MainActivity.java app/src/main/java/com/example/myapp/; fi
        
        # Create settings.gradle if missing
        if [ ! -f "settings.gradle" ]; then echo "include ':app'" > settings.gradle; fi
        
        # Setup root build.gradle if missing
        if [ ! -f "build.gradle" ]; then
          echo "plugins { id 'com.android.application' version '8.1.1' apply false }" > build.gradle
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
