name: Build Continuous Zoom RealWear Scanner APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Create Minimal Android Project (If not present)
        run: |
          if [ ! -f "build.gradle" ]; then
            echo "Creating build files..."
            
            # Root build.gradle
            cat << 'EOF' > build.gradle
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:8.1.1'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            EOF

            # app/build.gradle
            mkdir -p app/src/main/java/com/realwear/scanner
            mkdir -p app/src/main/res/layout

            cat << 'EOF' > app/build.gradle
            plugins {
                id 'com.android.application'
            }

            android {
                namespace 'com.realwear.scanner'
                compileSdk 34

                defaultConfig {
                    applicationId "com.realwear.scanner"
                    minSdk 26
                    targetSdk 34
                    versionCode 1
                    versionName "1.0"
                }

                buildTypes {
                    release {
                        minifyEnabled false
                    }
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }

            dependencies {
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation 'com.google.android.material:material:1.11.0'
                implementation 'androidx.camera:camera-core:1.3.1'
                implementation 'androidx.camera:camera-camera2:1.3.1'
                implementation 'androidx.camera:camera-lifecycle:1.3.1'
                implementation 'androidx.camera:camera-view:1.3.1'
                implementation 'com.google.mlkit:barcode-scanning:17.2.0'
            }
            EOF

            # settings.gradle
            echo "include ':app'" > settings.gradle

            # AndroidManifest.xml
            mkdir -p app/src/main
            cat << 'EOF' > app/src/main/AndroidManifest.xml
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-feature android:name="android.hardware.camera" />
                <uses-permission android:name="android.permission.CAMERA" />

                <application
                    android:allowBackup="true"
                    android:icon="@mipmap/ic_launcher"
                    android:label="RealWear Scanner"
                    android:supportsRtl="true"
                    android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                    <activity
                        android:name=".MainActivity"
                        android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF

            # MainActivity.java (Continuous Zoom & Scanner for RealWear)
            cat << 'EOF' > app/src/main/java/com/realwear/scanner/MainActivity.java
            package com.realwear.scanner;

            import android.Manifest;
            import android.content.pm.PackageManager;
            import android.os.Bundle;
            import android.widget.Toast;
            import androidx.annotation.NonNull;
            import androidx.appcompat.app.AppCompatActivity;
            import androidx.camera.core.Camera;
            import androidx.camera.core.CameraSelector;
            import androidx.camera.core.ImageAnalysis;
            import androidx.camera.core.Preview;
            import androidx.camera.lifecycle.ProcessCameraProvider;
            import androidx.camera.view.PreviewView;
            import androidx.core.app.ActivityCompat;
            import androidx.core.content.ContextCompat;
            import com.google.common.util.concurrent.ListenableFuture;
            import com.google.mlkit.vision.barcode.BarcodeScanner;
            import com.google.mlkit.vision.barcode.BarcodeScanning;
            import com.google.mlkit.vision.common.InputImage;
            import java.util.concurrent.ExecutionException;
            import java.util.concurrent.ExecutorService;
            import java.util.concurrent.Executors;

            public class MainActivity extends AppCompatActivity {
                private PreviewView previewView;
                private Camera camera;
                private float currentZoom = 1.0f;
                private ExecutorService cameraExecutor;

                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    previewView = new PreviewView(this);
                    setContentView(previewView);

                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                            == PackageManager.PERMISSION_GRANTED) {
                        startCamera();
                    } else {
                        ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, 101);
                    }

                    cameraExecutor = Executors.newSingleThreadExecutor();
                }

                private void startCamera() {
                    ListenableFuture<ProcessCameraProvider> cameraProviderFuture =
                            ProcessCameraProvider.getInstance(this);

                    cameraProviderFuture.addListener(() -> {
                        try {
                            ProcessCameraProvider cameraProvider = cameraProviderFuture.get();
                            Preview preview = new Preview.Builder().build();
                            preview.setSurfaceProvider(previewView.getSurfaceProvider());

                            BarcodeScanner scanner = BarcodeScanning.getClient();
                            ImageAnalysis imageAnalysis = new ImageAnalysis.Builder()
                                    .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                                    .build();

                            imageAnalysis.setAnalyzer(cameraExecutor, imageProxy -> {
                                @SuppressWarnings("unsafe")
                                android.media.Image mediaImage = imageProxy.getImage();
                                if (mediaImage != null) {
                                    InputImage image = InputImage.fromMediaImage(mediaImage, imageProxy.getImageInfo().getRotationDegrees());
                                    scanner.process(image)
                                            .addOnSuccessListener(barcodes -> {
                                                if (!barcodes.isEmpty()) {
                                                    String rawValue = barcodes.get(0).getRawValue();
                                                    runOnUiThread(() -> Toast.makeText(MainActivity.this, "Scanned: " + rawValue, Toast.LENGTH_SHORT).show());
                                                }
                                            })
                                            .addOnCompleteListener(task -> imageProxy.close());
                                } else {
                                    imageProxy.close();
                                }
                            });

                            CameraSelector cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA;
                            cameraProvider.unbindAll();
                            camera = cameraProvider.bindToLifecycle(this, cameraSelector, preview, imageAnalysis);

                        } catch (ExecutionException | InterruptedException e) {
                            e.printStackTrace();
                        }
                    }, ContextCompat.getMainExecutor(this));
                }
            }
            EOF
          fi

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealWear-Scanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
