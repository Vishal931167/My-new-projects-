name: Build Continuous Zoom RealWear Scanner APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Continuous Zoom Scanner Project
      run: |
        rm -rf app settings.gradle build.gradle
        mkdir -p app/src/main/java/com/realwear/barcodescanner

        # 1. Java Source Code with Continuous Zoom In/Out & Flash
        cat << 'EOF' > app/src/main/java/com/realwear/barcodescanner/MainActivity.java
        package com.realwear.barcodescanner;

        import android.Manifest;
        import android.content.pm.PackageManager;
        import android.os.Bundle;
        import android.util.Size;
        import android.widget.Button;
        import android.widget.LinearLayout;
        import android.widget.TextView;
        import android.widget.Toast;
        import androidx.annotation.NonNull;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.camera.core.Camera;
        import androidx.camera.core.CameraSelector;
        import androidx.camera.core.ImageAnalysis;
        import androidx.camera.core.Preview;
        import androidx.camera.lifecycle.ProcessCameraProvider;
        import androidx.camera.view.PreviewView;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import com.google.common.util.concurrent.ListenableFuture;
        import com.google.mlkit.vision.barcode.BarcodeScanner;
        import com.google.mlkit.vision.barcode.BarcodeScanning;
        import com.google.mlkit.vision.barcode.common.Barcode;
        import com.google.mlkit.vision.common.InputImage;
        import java.util.concurrent.ExecutionException;
        import java.util.concurrent.ExecutorService;
        import java.util.concurrent.Executors;

        public class MainActivity extends AppCompatActivity {
            private static final int CAMERA_PERMISSION_CODE = 101;
            private PreviewView previewView;
            private TextView txtResult;
            private ExecutorService cameraExecutor;
            private Camera camera;
            private boolean isFlashOn = false;
            
            // Continuous zoom tracking (Ratio from 0.0 to 1.0)
            private float currentZoomRatio = 0.0f;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(createLayout());
                cameraExecutor = Executors.newSingleThreadExecutor();

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                    startCamera();
                } else {
                    ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, CAMERA_PERMISSION_CODE);
                }
            }

            private android.view.View createLayout() {
                LinearLayout mainLayout = new LinearLayout(this);
                mainLayout.setOrientation(LinearLayout.VERTICAL);
                mainLayout.setLayoutParams(new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        LinearLayout.LayoutParams.MATCH_PARENT));

                LinearLayout.LayoutParams rowParams = new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, 0, 0.10f);
                LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f);
                btnParams.setMargins(3, 3, 3, 3);

                // --- Control Row: Zoom In, Zoom Out, Reset, Flash ---
                LinearLayout controlBar = new LinearLayout(this);
                controlBar.setOrientation(LinearLayout.HORIZONTAL);
                controlBar.setBackgroundColor(0xFF111111);
                controlBar.setLayoutParams(rowParams);

                Button btnZoomIn = new Button(this);
                btnZoomIn.setText("ZOOM IN");
                btnZoomIn.setOnClickListener(v -> adjustZoom(true));
                btnZoomIn.setLayoutParams(btnParams);
                controlBar.addView(btnZoomIn);

                Button btnZoomOut = new Button(this);
                btnZoomOut.setText("ZOOM OUT");
                btnZoomOut.setOnClickListener(v -> adjustZoom(false));
                btnZoomOut.setLayoutParams(btnParams);
                controlBar.addView(btnZoomOut);

                Button btnReset = new Button(this);
                btnReset.setText("RESET ZOOM");
                btnReset.setOnClickListener(v -> resetZoom());
                btnReset.setLayoutParams(btnParams);
                controlBar.addView(btnReset);

                Button btnFlash = new Button(this);
                btnFlash.setText("TOGGLE FLASH");
                btnFlash.setOnClickListener(v -> toggleFlash());
                btnFlash.setLayoutParams(btnParams);
                controlBar.addView(btnFlash);

                mainLayout.addView(controlBar);

                // --- Camera Preview Feed ---
                previewView = new PreviewView(this);
                LinearLayout.LayoutParams previewParams = new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, 0, 0.65f);
                previewView.setLayoutParams(previewParams);
                mainLayout.addView(previewView);

                // --- Scanned Data Result Display Panel ---
                txtResult = new TextView(this);
                txtResult.setText("10m Scanner Ready. Say 'ZOOM IN' until barcode is clear...");
                txtResult.setTextSize(16);
                txtResult.setPadding(20, 20, 20, 20);
                txtResult.setBackgroundColor(0xFF222222);
                txtResult.setTextColor(0xFFFFFFFF);
                LinearLayout.LayoutParams textParams = new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT, 0, 0.25f);
                txtResult.setLayoutParams(textParams);
                mainLayout.addView(txtResult);

                return mainLayout;
            }

            private void adjustZoom(boolean zoomIn) {
                if (camera != null) {
                    if (zoomIn) {
                        currentZoomRatio += 0.15f; // हर बार बोलने पर थोड़ा और ज़ूम बढ़ेगा
                        if (currentZoomRatio > 1.0f) currentZoomRatio = 1.0f; // मैक्सिमम लिमिट
                    } else {
                        currentZoomRatio -= 0.15f; // ज़ूम घटेगा
                        if (currentZoomRatio < 0.0f) currentZoomRatio = 0.0f; // मिनिमम लिमिट
                    }
                    camera.getCameraControl().setLinearZoom(currentZoomRatio);
                    Toast.makeText(this, "Zoom Level: " + Math.round(currentZoomRatio * 100) + "%", Toast.LENGTH_SHORT).show();
                }
            }

            private void resetZoom() {
                if (camera != null) {
                    currentZoomRatio = 0.0f;
                    camera.getCameraControl().setLinearZoom(currentZoomRatio);
                    Toast.makeText(this, "Zoom Reset (1x)", Toast.LENGTH_SHORT).show();
                }
            }

            private void toggleFlash() {
                if (camera != null && camera.getCameraInfo().hasFlashUnit()) {
                    isFlashOn = !isFlashOn;
                    camera.getCameraControl().enableTorch(isFlashOn);
                }
            }

            private void startCamera() {
                ListenableFuture<ProcessCameraProvider> cameraProviderFuture = ProcessCameraProvider.getInstance(this);
                cameraProviderFuture.addListener(() -> {
                    try {
                        ProcessCameraProvider cameraProvider = cameraProviderFuture.get();
                        
                        Preview preview = new Preview.Builder().build();
                        preview.setSurfaceProvider(previewView.getSurfaceProvider());

                        ImageAnalysis imageAnalysis = new ImageAnalysis.Builder()
                                .setTargetResolution(new Size(1920, 1080))
                                .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                                .build();

                        BarcodeScanner scanner = BarcodeScanning.getClient();

                        imageAnalysis.setAnalyzer(cameraExecutor, imageProxy -> {
                            @SuppressWarnings("UnsafeOptInUsageError")
                            android.media.Image mediaImage = imageProxy.getImage();
                            if (mediaImage != null) {
                                InputImage image = InputImage.fromMediaImage(mediaImage, imageProxy.getImageInfo().getRotationDegrees());
                                scanner.process(image)
                                        .addOnSuccessListener(barcodes -> {
                                            for (Barcode barcode : barcodes) {
                                                String rawValue = barcode.getRawValue();
                                                int valueType = barcode.getValueType();
                                                runOnUiThread(() -> txtResult.setText("Scanned Successfully:\n" + rawValue + "\nType: " + valueType));
                                            }
                                        })
                                        .addOnCompleteListener(task -> imageProxy.close());
                            } else {
                                imageProxy.close();
                            }
                        });

                        CameraSelector cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA;
                        cameraProvider.unbindAll();
                        camera = cameraProvider.bindToLifecycle(this, cameraSelector, preview, imageAnalysis);

                        resetZoom();

                    } catch (ExecutionException | InterruptedException e) {
                        e.printStackTrace();
                    }
                }, ContextCompat.getMainExecutor(this));
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                if (requestCode == CAMERA_PERMISSION_CODE && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                    startCamera();
                } else {
                    Toast.makeText(this, "Camera Permission Required", Toast.LENGTH_SHORT).show();
                }
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                cameraExecutor.shutdown();
            }
        }
        EOF

        # 2. Android Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.realwear.barcodescanner">

            <uses-permission android:name="android.permission.CAMERA" />
            <uses-feature android:name="android.hardware.camera" android:required="true" />
            <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

            <application
                android:allowBackup="true"
                android:label="RealWear Scanner"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 3. Settings Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "RealWearScanner"
        include ':app'
        EOF

        # 4. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        # 5. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.realwear.barcodescanner'
            compileSdk 34

            defaultConfig {
                applicationId "com.realwear.barcodescanner"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            
            def camerax_version = "1.3.1"
            implementation "androidx.camera:camera-core:${camerax_version}"
            implementation "androidx.camera:camera-camera2:${camerax_version}"
            implementation "androidx.camera:camera-lifecycle:${camerax_version}"
            implementation "androidx.camera:camera-view:${camerax_version}"
            
            implementation 'com.google.mlkit:barcode-scanning:17.2.0'
            implementation 'com.google.guava:guava:31.1-android'
        }
        EOF

    - name: Setup Gradle
      uses: actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: realwear-continuous-zoom-scanner
        path: app/build/outputs/apk/debug/app-debug.apk
